name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, and test
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ needs.versions.outputs.go }}
          cache: true
          cache-dependency-path: |
            go.mod
            tools/go.sum
      - name: Verify module files
        run: |
          go mod tidy
          (cd tools && go mod tidy)
          git diff --exit-code HEAD -- go.mod go.sum tools/go.mod tools/go.sum
          test -z "$(git ls-files --others --exclude-standard -- go.mod go.sum tools/go.mod tools/go.sum)"
      - name: Run checks
        run: make check
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
      - name: Analyze with SonarQube Cloud
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  integration:
    name: PostgreSQL integration and end-to-end
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:${{ needs.versions.outputs.postgres }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_USER: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ needs.versions.outputs.go }}
          cache: true
          cache-dependency-path: |
            integration/go.sum
            tools/go.sum
      - name: Verify test module files
        run: |
          (cd integration && go mod tidy)
          git diff --exit-code HEAD -- integration/go.mod integration/go.sum
          test -z "$(git ls-files --others --exclude-standard -- integration/go.mod integration/go.sum)"
      - name: Run integration and end-to-end tests
        env:
          HARDCORE_TEST_DATABASE_URL: postgres://postgres:integration-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: make test-integration

  # Service containers are created before steps, so load pins in a separate job.
  versions:
    name: Read central version pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.pins.outputs.go }}
      postgres: ${{ steps.pins.outputs.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read versions.yaml
        id: pins
        run: |
          go_version=$(bash scripts/version.sh GO_VERSION)
          postgres_tag=$(bash scripts/version.sh POSTGRES_TAG)
          echo "go=$go_version" >> "$GITHUB_OUTPUT"
          echo "postgres=$postgres_tag" >> "$GITHUB_OUTPUT"
