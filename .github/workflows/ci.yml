name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, and test
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.versions.outputs.go }}
          cache: true
          cache-dependency-path: |
            go.mod
            tools/go.sum
      - name: Verify module files
        run: |
          go mod tidy
          (cd tools && go mod tidy)
          git diff --exit-code HEAD -- go.mod go.sum tools/go.mod tools/go.sum
          test -z "$(git ls-files --others --exclude-standard -- go.mod go.sum tools/go.mod tools/go.sum)"
      - name: Run checks
        run: make check
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  integration:
    name: PostgreSQL integration and end-to-end
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:${{ needs.versions.outputs.postgres }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_USER: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.versions.outputs.go }}
          cache: true
          cache-dependency-path: |
            integration/go.sum
            tools/go.sum
      - name: Verify test module files
        run: |
          (cd integration && go mod tidy)
          git diff --exit-code HEAD -- integration/go.mod integration/go.sum
          test -z "$(git ls-files --others --exclude-standard -- integration/go.mod integration/go.sum)"
      - name: Run integration and end-to-end tests
        env:
          HARDCORE_TEST_DATABASE_URL: postgres://postgres:integration-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: make test-integration

  # Service containers are created before steps, so load pins in a separate job.
  versions:
    name: Read central version pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.pins.outputs.go }}
      postgres: ${{ steps.pins.outputs.postgres }}
    steps:
      - uses: actions/checkout@v7
      - name: Read versions.yaml
        id: pins
        run: |
          go_version=$(bash scripts/version.sh GO_VERSION)
          postgres_tag=$(bash scripts/version.sh POSTGRES_TAG)
          echo "go=$go_version" >> "$GITHUB_OUTPUT"
          echo "postgres=$postgres_tag" >> "$GITHUB_OUTPUT"
