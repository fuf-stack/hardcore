name: Bug report
description: Report reproducible incorrect behavior in a published package.
title: 'bug: '
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options: [health, service, repository tooling]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 'v0.1.0'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal repository, test, or exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go version, operating system, and relevant runtime details.
