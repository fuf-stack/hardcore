# Publish analysis to the existing Hardcore project in SonarQube Cloud.
sonar.organization=fuf-stack
sonar.projectKey=fuf-stack_hardcore

# Go keeps tests alongside production code. Classify each file only once.
sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# The CI workflow generates this profile when it runs make check.
sonar.go.coverage.reportPaths=coverage.out
